name: audit
# Build + content/URL audit + redirect walk on every push/PR. Make this the required
# status check via branch protection on the default branch (Skill 8).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (zod enforces required-field completeness)
        run: npm run build
      - name: Compile CMS-managed redirects into dist/_redirects
        run: node scripts/build-redirects.mjs
      - name: Content / URL audit
        run: node scripts/audit.mjs
      - name: Redirect walk
        run: node scripts/redirects.mjs
      # Post-deploy IndexNow ping — production (default-branch push) only; never on PRs.
      # No-ops until an IndexNow key is configured; best-effort, never blocks.
      - name: IndexNow ping
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/indexnow-ping.mjs
      # MANDATORY build-failure alerting (Skill 8 §8). Add SLACK_WEBHOOK as a repo
      # secret; no-ops with a log line if the secret is absent.
      - name: Slack alert on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -sf -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\":rotating_light: *audit failed* — ${{ github.repository }} on ${{ github.ref_name }} (${{ github.event_name }}). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK" || echo "Slack post failed (non-blocking)."
          else
            echo "SLACK_WEBHOOK not set — skipping Slack alert."
          fi
