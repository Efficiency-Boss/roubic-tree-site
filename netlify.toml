# Netlify build + hosting for Roubic Tree & Landscape.
# Deploy previews on PRs are on by default. Skill 8 owns launch config
# (custom domain, preview noindex, form handling, IndexNow).

[build]
  command = "npm run build && node scripts/build-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
